[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/app/init-postgres.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/postgres.err.log
stdout_logfile=/var/log/postgres.out.log
priority=1

[program:backend]
command=node /app/backend/server.js
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/backend.err.log
stdout_logfile=/var/log/backend.out.log
environment=NODE_ENV="production",DB_HOST="localhost",DB_PORT="5432",DB_NAME="asl_teacher",DB_USER="postgres",DB_PASSWORD="postgres",PORT="3001",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s"
priority=2

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
priority=3
